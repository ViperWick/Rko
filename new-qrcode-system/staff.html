<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-pi 主辦方掃描系統</title>
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Microsoft YaHei UI", sans-serif;
            background-color: #1a237e;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            text-align: center;
        }

        .logo {
            font-size: 36px;
            font-weight: bold;
            margin: 20px 0;
        }

        #reader {
            width: 100%;
            max-width: 600px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }

        .result {
            margin: 20px;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
        }

        button {
            background-color: #ff8f00;
            color: white;
            border: none;
            padding: 12px 40px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            margin: 10px;
        }

        button:hover {
            background-color: #f57c00;
        }

        .result-status {
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
        }

        .success {
            color: #4caf50;
        }

        .fail {
            color: #f44336;
        }

        .waiting {
            color: #ffffff;
        }

        #actionButtons {
            display: none;
        }

        .manual-control {
            margin-top: 20px;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Q-pi</div>
        <h2>主辦方掃描系統</h2>
        
        <div id="reader"></div>
        
        <div class="result">
            <h3>掃描結果</h3>
            <div id="scanResult">等待掃描...</div>
            <div id="resultStatus" class="result-status waiting">等待掃描...</div>
        </div>

        <div id="actionButtons">
            <button onclick="markAttendance('success')">報到成功</button>
            <button onclick="markAttendance('fail')">報到失敗</button>
        </div>

        <!-- 手動控制區域 -->
        <div class="manual-control">
            <h3>測試用手動控制</h3>
            <button onclick="simulateScan('J112386790')">模擬掃描選手 J112386790</button>
        </div>
    </div>

    <script>
        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", { fps: 10, qrbox: 250 });

        function onScanSuccess(decodedText, decodedResult) {
            try {
                const data = JSON.parse(decodedText);
                const scanResult = document.getElementById('scanResult');
                scanResult.innerHTML = `
                    <p>選手姓名：${data.name}</p>
                    <p>選手編號：${data.player_id}</p>
                    <p>比賽項目：${data.category}</p>
                    <p>生成時間：${new Date(data.timestamp).toLocaleString()}</p>
                `;
                scanResult.dataset.playerData = decodedText;
                
                document.getElementById('actionButtons').style.display = 'block';
                document.getElementById('resultStatus').innerHTML = '請選擇報到狀態';
                document.getElementById('resultStatus').className = 'result-status waiting';
            } catch (e) {
                document.getElementById('scanResult').innerHTML = 
                    '<p class="status-fail">無效的QR碼</p>';
                document.getElementById('actionButtons').style.display = 'none';
            }
        }

        html5QrcodeScanner.render(onScanSuccess);

        // 模擬掃描功能
        function simulateScan(playerId) {
            const testData = {
                name: '宋宛蓉',
                player_id: playerId,
                category: '29歲以下女雙',
                timestamp: new Date().toISOString()
            };
            onScanSuccess(JSON.stringify(testData));
        }

        function markAttendance(status) {
            const resultStatus = document.getElementById('resultStatus');
            const scanData = document.getElementById('scanResult').dataset.playerData;
            
            if (!scanData) {
                alert('無效的掃描數據');
                return;
            }

            const playerData = JSON.parse(scanData);
            
            if (status === 'success') {
                resultStatus.innerHTML = '報到成功！';
                resultStatus.className = 'result-status success';
                updateAttendanceStatus(playerData.player_id, true);
            } else {
                resultStatus.innerHTML = '報到失敗';
                resultStatus.className = 'result-status fail';
                updateAttendanceStatus(playerData.player_id, false);
            }
            
            document.getElementById('actionButtons').style.display = 'none';
            
            setTimeout(() => {
                document.getElementById('scanResult').innerHTML = '等待掃描...';
                resultStatus.innerHTML = '等待掃描...';
                resultStatus.className = 'result-status waiting';
            }, 3000);
        }

        function updateAttendanceStatus(playerId, isSuccess) {
            const attendanceData = JSON.parse(localStorage.getItem('attendance') || '{}');
            attendanceData[playerId] = {
                status: isSuccess ? '已報到' : '報到失敗',
                time: new Date().toISOString()
            };
            localStorage.setItem('attendance', JSON.stringify(attendanceData));
        }
    </script>
</body>
</html>
