<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-pi 後台管理系統</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Microsoft YaHei UI", sans-serif;
            background-color: #1a237e;
            color: white;
        }

        .container {
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: rgba(255,255,255,0.1);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        button {
            background-color: #ff8f00;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #f57c00;
        }

        .data-table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            background: white;
            color: #333;
        }

        .data-table th, .data-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        .data-table th {
            background-color: #f5f5f5;
        }

        .data-table tr:hover {
            background-color: #f9f9f9;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        .status-success {
            background-color: #4caf50;
            color: white;
        }

        .status-pending {
            background-color: #ff9800;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">Q-pi 後台管理系統</div>
            <div class="actions">
                <button onclick="importData()">匯入資料</button>
                <button onclick="exportData()">匯出報表</button>
                <button onclick="addCompetition()">新增比賽</button>
            </div>
        </div>

        <table class="data-table">
            <thead>
                <tr>
                    <th>項目</th>
                    <th>姓名</th>
                    <th>選手編號</th>
                    <th>組別</th>
                    <th>身分證字號</th>
                    <th>報到狀態</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="playerList">
                <!-- 測試數據 -->
                <tr>
                    <td>29歲以下女雙</td>
                    <td>宋宛蓉</td>
                    <td>J112386790</td>
                    <td>A組</td>
                    <td>A123456789</td>
                    <td><span class="status-badge status-pending">未報到</span></td>
                    <td>
                        <button onclick="editPlayer(this)">編輯</button>
                        <button onclick="deletePlayer(this)">刪除</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div id="competitionModal" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 8px;">
        <h2>新增比賽</h2>
        <form id="competitionForm">
            <div>
                <label>比賽名稱：</label>
                <input type="text" name="name" required>
            </div>
            <div>
                <label>比賽日期：</label>
                <input type="date" name="date" required>
            </div>
            <div>
                <label>比賽地點：</label>
                <input type="text" name="location" required>
            </div>
            <div>
                <button type="submit">確定</button>
                <button type="button" onclick="closeCompetitionModal()">取消</button>
            </div>
        </form>
    </div>

    <script>
        let competitionData = {
            players: []
        };

        function saveToLocalStorage() {
            localStorage.setItem('competitionData', JSON.stringify(competitionData));
        }

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('competitionData');
            if (saved) {
                competitionData = JSON.parse(saved);
                renderPlayerList();
            }
        }

        function renderPlayerList() {
            const tbody = document.getElementById('playerList');
            tbody.innerHTML = competitionData.players.map(player => `
                <tr>
                    <td>${player.category}</td>
                    <td>${player.name}</td>
                    <td>${player.id}</td>
                    <td>${player.group}</td>
                    <td>${player.personalId}</td>
                    <td><span class="status-badge ${player.status === '已報到' ? 'status-success' : 'status-pending'}">${player.status}</span></td>
                    <td>
                        <button onclick="editPlayer(this)">編輯</button>
                        <button onclick="deletePlayer(this)">刪除</button>
                    </td>
                </tr>
            `).join('');
        }

        function importData() {
            // 创建文件输入元素
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.xlsx,.xls,.csv';
            
            input.onchange = function(e) {
                const file = e.target.files[0];
                // 这里可以添加Excel文件解析逻辑
                // 可以使用xlsx库来处理Excel文件
                console.log('文件已选择:', file.name);
            }
            
            input.click();
        }

        function exportData() {
            // 获取表格数据
            const table = document.querySelector('.data-table');
            const rows = Array.from(table.querySelectorAll('tbody tr'));
            
            // 转换为CSV格式
            const csvContent = rows.map(row => {
                return Array.from(row.cells)
                    .slice(0, -1) // 排除最后一列的操作按钮
                    .map(cell => cell.textContent)
                    .join(',');
            }).join('\n');
            
            // 创建下载链接
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '比賽資料.csv';
            link.click();
        }

        function addCompetition() {
            // 實現新增比賽功能
            alert('新增比賽');
        }

        function editPlayer(btn) {
            const row = btn.parentNode.parentNode;
            alert('編輯選手：' + row.cells[1].textContent);
        }

        function deletePlayer(btn) {
            const row = btn.parentNode.parentNode;
            if (confirm('確定要刪除選手：' + row.cells[1].textContent + '?')) {
                row.remove();
            }
        }

        function updateAttendanceDisplay() {
            const attendanceData = JSON.parse(localStorage.getItem('attendance') || '{}');
            const rows = document.querySelectorAll('#playerList tr');
            
            rows.forEach(row => {
                const playerId = row.querySelector('td:nth-child(3)').textContent; // 選手編號欄位
                const statusCell = row.querySelector('td:nth-child(6)'); // 報到狀態欄位
                const playerStatus = attendanceData[playerId];
                
                if (playerStatus) {
                    const statusBadge = statusCell.querySelector('.status-badge');
                    statusBadge.textContent = playerStatus.status;
                    statusBadge.className = `status-badge ${playerStatus.status === '已報到' ? 'status-success' : 'status-pending'}`;
                }
            });
        }

        // 定期更新狀態顯示
        setInterval(updateAttendanceDisplay, 1000);

        // 在頁面載入時也更新一次
        document.addEventListener('DOMContentLoaded', updateAttendanceDisplay);
    </script>
</body>
</html>
