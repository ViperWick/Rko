<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-pi 選手報到系統</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Microsoft YaHei UI", sans-serif;
            background-color: #1a237e;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .logo {
            font-size: 36px;
            font-weight: bold;
            margin: 40px 0 20px;
        }

        .title {
            font-size: 24px;
            margin-bottom: 40px;
        }

        .input-container {
            margin: 20px 0;
        }

        input {
            width: 300px;
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            text-align: center;
        }

        button {
            background-color: #ff8f00;
            color: white;
            border: none;
            padding: 12px 40px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            margin: 20px 0;
        }

        button:hover {
            background-color: #f57c00;
        }

        .copyright {
            font-size: 12px;
            margin-top: auto;
            padding: 20px;
        }

        /* 票券視窗樣式 */
        .ticket-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
        }

        .ticket-content {
            background-color: white;
            color: #333;
            padding: 40px;
            border-radius: 8px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .ticket-content h2 {
            color: #1a237e;
            margin-bottom: 20px;
        }

        #qrcode {
            margin: 20px auto;
        }

        .close-button {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Q-pi</div>
        <div class="title">
            2024體育全國羽球錦標賽<br>
            Q-pi 比賽報到系統
        </div>

        <div class="input-container">
            <input type="text" id="idInput" placeholder="請輸入身分證字號後五碼" 
                   onfocus="clearPlaceholder(this)" 
                   onblur="restorePlaceholder(this)">
        </div>

        <button onclick="verifyId()">送出</button>

        <div class="copyright">
            Q-pi 報到系統 © Copyright 2024 ParamitaDigital | All Rights Reserved
        </div>
    </div>

    <!-- 票券視窗 -->
    <div id="ticketModal" class="ticket-modal">
        <div class="ticket-content">
            <h2>Q-pi TICKET</h2>
            <div id="playerInfo"></div>
            <div id="qrcode"></div>
            <button onclick="downloadTicket()">下載至手機</button>
        </div>
    </div>

    <script>
        // 測試用的資料庫
        const testData = {
            '56789': { name: '宋宛蓉', category: '29歲以下女雙', id: 'A123456789' },
            '54321': { name: '陳慧馨', category: '29歲以下女雙', id: 'B987654321' }
        };

        function clearPlaceholder(input) {
            if (input.value === input.placeholder) {
                input.value = '';
            }
        }

        function restorePlaceholder(input) {
            if (input.value === '') {
                input.value = input.placeholder;
            }
        }

        function verifyId() {
            const id = document.getElementById('idInput').value;
            if (testData[id]) {
                generateTicket(testData[id]);
            } else {
                alert('找不到此身分證號碼，請確認後重試');
            }
        }

        function generateTicket(participant) {
            const modal = document.getElementById('ticketModal');
            const playerInfo = document.getElementById('playerInfo');
            const qrcodeDiv = document.getElementById('qrcode');

            // 清空現有內容
            playerInfo.innerHTML = '';
            qrcodeDiv.innerHTML = '';

            // 生成選手編號
            const playerId = 'J' + Math.random().toString().slice(2,11);

            // 添加選手信息
            playerInfo.innerHTML = `
                <p style="font-size: 18px">${participant.name}</p>
                <p>選手編號：${playerId}</p>
                <p>${participant.category}</p>
            `;

            // 生成QR碼
            const qr = qrcode(0, 'L');
            qr.addData(JSON.stringify({
                name: participant.name,
                player_id: playerId,
                category: participant.category,
                timestamp: new Date().toISOString()
            }));
            qr.make();
            qrcodeDiv.innerHTML = qr.createImgTag(6);

            // 顯示視窗
            modal.style.display = 'flex';
        }

        function downloadTicket() {
            const qrImage = document.querySelector('#qrcode img');
            const link = document.createElement('a');
            link.download = 'ticket.png';
            link.href = qrImage.src;
            link.click();
        }

        // 點擊視窗外關閉
        window.onclick = function(event) {
            const modal = document.getElementById('ticketModal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }
    </script>
</body>
</html>
